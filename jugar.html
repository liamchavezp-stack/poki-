<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jugar - LiamPlay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="pagina">
  <header class="barra">
    <a class="logo" href="index.html" title="Volver a todos los juegos"><span class="logo-icono">🎮</span>Liam<b>Play</b></a>
    <h1 id="titulo">Cargando…</h1>
    <button class="boton" id="completa" type="button">⛶ Pantalla completa</button>
    <a class="boton" href="index.html">← Todos los juegos</a>
  </header>

  <section class="marco" id="marco">
    <div id="zona-canvas" hidden>
      <div class="marcador"><span>Puntos: <b id="pts">0</b></span><span>Récord: <b id="rec">0</b></span></div>
      <div class="lienzo">
        <canvas id="c" width="400" height="400"></canvas>
        <div id="fin"><h2>Fin del juego</h2><p></p><button class="boton" id="otra" type="button">Jugar otra vez</button></div>
      </div>
      <div id="pad"></div>
      <p id="ayuda"></p>
    </div>
    <div id="zona-otra"></div>
  </section>

  <section class="descripcion"><p id="desc"></p></section>

  <h2 class="titulo-mas">Más juegos</h2>
  <div class="cuadricula mas" id="mas"></div>
  <footer class="pie">LiamPlay · Código libre con licencia MIT</footer>
</main>
<script src="juegos.js"></script>
<script src="jugar.js"></script>
</body>
</html>
